    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2RC890ZE3S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
 
      // Configuração base GA4
      gtag('config', 'G-2RC890ZE3S', {
        send_page_view: true,
        cookie_flags: 'SameSite=None;Secure'
      });
 
      // Helper global — usado pelo App.tsx via window.trackEvent()
      window.trackEvent = function(eventName, params) {
        try {
          // GA4
          if (typeof gtag === 'function') {
            gtag('event', eventName, params || {});
          }
          // Meta Pixel
          if (typeof fbq === 'function') {
            // Eventos padrão Meta
            var metaStandard = [
              'PageView','ViewContent','AddToCart',
              'InitiateCheckout','Purchase','Lead',
              'CompleteRegistration','Search','Contact'
            ];
            if (metaStandard.indexOf(eventName) !== -1) {
              fbq('track', eventName, params || {});
            } else {
              fbq('trackCustom', eventName, params || {});
            }
          }
        } catch(e) { /* silent */ }
      };
 
      // Rastreia scroll depth automaticamente para GA4
      var _scrollMarks = {};
      window.addEventListener('scroll', function() {
        var scrollPct = Math.round(
          (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100
        );
        [25, 50, 75, 90].forEach(function(mark) {
          if (scrollPct >= mark && !_scrollMarks[mark]) {
            _scrollMarks[mark] = true;
            gtag('event', 'scroll_depth', { depth: mark });
          }
        });
      }, { passive: true });
 
      // Rastreia tempo na página (30s e 60s)
      setTimeout(function() {
        gtag('event', 'time_on_page', { seconds: 30 });
      }, 30000);
      setTimeout(function() {
