  <body class="bg-black text-white antialiased selection:bg-[#00E5FF] selection:text-black">
    
    <div id="root"></div>

    <script>
      document.addEventListener('click', function(event) {
        // Encontra o link clicado ou o elemento pai mais próximo que seja um link
        var targetLink = event.target.closest('a');
        
        if (targetLink && targetLink.href) {
          var url = targetLink.href;

          // 1. Rastreio Dinâmico do WhatsApp (Conversão / Lead)
          if (url.includes('wa.me') || url.includes('whatsapp.com')) {
            // Verifica se o botão tem um ID específico para rastreio cirúrgico
            if (targetLink.id === 'btn-wa-hero') {
              gtag('event', 'generate_lead', {
                'event_category': 'Funnel',
                'event_label': 'Clique WhatsApp - Topo Hero',
                'value': 1.0
              });
            } else if (targetLink.id === 'btn-wa-checkout') {
              gtag('event', 'generate_lead', {
                'event_category': 'Funnel',
                'event_label': 'Clique WhatsApp - Checkout Fundador',
                'value': 2.0
              });
            } else {
              gtag('event', 'generate_lead', {
                'event_category': 'Funnel',
                'event_label': 'Clique WhatsApp - Link Geral',
                'value': 1.0
              });
            }
          }
          
          // 2. Rastreio do Instagram
          else if (url.includes('instagram.com')) {
            gtag('event', 'click_social_instagram', {
              'event_category': 'Social_Engagement',
              'event_label': 'Visita ao Perfil do Instagram'
            });
          }
          
          // 3. Rastreio do YouTube
          else if (url.includes('youtube.com') || url.includes('youtu.be')) {
            gtag('event', 'click_social_youtube', {
              'event_category': 'Social_Engagement',
              'event_label': 'Visita ao Canal do YouTube'
            });
          }
          
          // 4. Rastreio do Facebook
          else if (url.includes('facebook.com')) {
            gtag('event', 'click_social_facebook', {
              'event_category': 'Social_Engagement',
              'event_label': 'Visita à Página do Facebook'
            });
          }
          
          // 5. Rastreio do TikTok
          else if (url.includes('tiktok.com')) {
            gtag('event', 'click_social_tiktok', {
              'event_category': 'Social_Engagement',
              'event_label': 'Visita ao Perfil do TikTok'
            });
          }
        }
      });
    </script>
