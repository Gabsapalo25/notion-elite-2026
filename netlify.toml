# ═══════════════════════════════════════════════════════════
# netlify.toml — GlowScalePro | Notion Elite OS 2026
# ═══════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = "dist"

# ── Redirects para SPA (React Router sem React Router) ──
[[redirects]]
  from   = "/angola"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/checkout-angola"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/obrigado"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/thank-you"
  to     = "/index.html"
  status = 200

# ── Fallback SPA — todas as rotas desconhecidas vão para index ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de segurança e performance ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-XSS-Protection        = "1; mode=block"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# ── Cache para assets estáticos ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Sem cache para index.html (sempre fresh) ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"